<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecluna — what SPHEREx can and cannot see</title>
<meta name="description" content="A public tool for the NASA SPHEREx survey: flip a patch of sky through its visits, and read how faint an object the data could still show there.">
<link rel="icon" href="assets/img/logo-light.png" type="image/png">
<link rel="preload" href="assets/vendor/fonts/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/vendor/css/pico.min.css">
<link rel="stylesheet" href="assets/vendor/css/uplot.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="stage">

  <section class="view is-active" id="view-blink" aria-label="Flip through the visits">
    <img id="blink-frame" alt="" width="512" height="512">
  </section>

  <section class="view" id="view-track" aria-label="Track through time" hidden>
    <div class="cube-stage" id="cube-stage"></div>
  </section>

  <section class="view" id="view-curve" aria-label="Brightness per visit" hidden>
    <div class="curve-chart" id="curve-chart"></div>
  </section>

</main>

<!-- Controls float over the image, the way a sky atlas does. -->
<header class="overlay overlay-top">
  <a class="mark" href="#" aria-label="Ecluna">
    <img src="assets/img/logo-light.png" alt="" width="24" height="27">
    <span>ECLUNA</span>
  </a>

  <nav class="views" aria-label="Views">
    <button type="button" class="view-tab is-active" data-view="blink">Flip</button>
    <button type="button" class="view-tab" data-view="track">Track</button>
    <button type="button" class="view-tab" data-view="curve">Brightness</button>
  </nav>

  <button type="button" class="panel-toggle" id="panel-toggle"
          aria-expanded="false" aria-controls="panel">Numbers</button>
</header>

<div class="overlay overlay-bottom">
  <label class="pick">
    <span>Object</span>
    <select id="blink-object"></select>
  </label>

  <div class="scrub">
    <span id="blink-caption">Visit 1</span>
    <input id="blink-range" type="range" min="0" max="0" value="0" step="1">
  </div>

  <button id="blink-play" type="button" class="play">Play</button>
</div>

<p class="overlay overlay-note" id="view-note"></p>

<aside class="panel" id="panel" aria-label="Measured numbers" hidden>
  <div class="panel-head">
    <h2>Measured</h2>
    <button type="button" class="panel-close" id="panel-close" aria-label="Close the numbers">Close</button>
  </div>
  <dl class="facts" id="panel-facts"></dl>
  <p class="panel-note">
    Every number is read from a file in <code>results/</code> or
    <code>web/data/</code>. Nothing is typed in.
  </p>
</aside>

<script src="assets/vendor/js/uplot.iife.min.js"></script>
<script src="js/app.js" type="module"></script>
</body>
</html>
