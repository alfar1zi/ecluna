name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: tests
        run: python -m pytest -q

      - name: no internal paths tracked
        run: |
          if git ls-files | grep -E '^(CONCEPT|THEORY|PUBLICATION)\.md$|^scripts/git/'; then
            echo "internal file is tracked" >&2
            exit 1
          fi
          echo "no internal file is tracked"

      - name: no secrets in the tree
        run: |
          if git grep -nIE '(gho_|ghp_|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- . ':(exclude).github/' ; then
            echo "a credential pattern is present" >&2
            exit 1
          fi
          echo "no credential pattern found"
